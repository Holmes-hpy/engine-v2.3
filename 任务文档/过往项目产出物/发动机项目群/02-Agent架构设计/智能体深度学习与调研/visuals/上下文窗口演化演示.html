<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 上下文窗口演化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0c10;--sf:#15151c;--sf2:#1e1e28;--sf3:#272735;--bd:#2b2b3a;--tx:#e8e8f0;--txm:#8888a0;--txd:#55556a;--ac:#7c6bff;--acs:#7c6bff18;--acg:#7c6bff40;--ok:#4ade80;--wn:#fbbf24;--dg:#f87171;--info:#60a5fa;--pink:#f472b6;--c1:#7c6bff;--c2:#a78bfa;--c3:#34d399;--c4:#fbbf24;--c5:#60a5fa}
body{background:var(--bg);color:var(--tx);font-family:"PingFang SC","SF Pro Text",system-ui,sans-serif;font-size:13px;overflow:hidden;height:100vh}

/* Header */
.hdr{height:48px;padding:0 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:var(--sf);flex-shrink:0}
.hdr h1{font-size:15px;font-weight:600}
.hdr .sub{font-size:11px;color:var(--txm);margin-top:1px}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bd);cursor:pointer;transition:.3s;flex-shrink:0}
.dot.on{background:var(--ac);box-shadow:0 0 8px var(--acg);transform:scale(1.4)}
.dot.done{background:var(--ok)}

/* Layout */
.wrap{display:grid;grid-template-columns:200px 1fr 260px;height:calc(100vh - 48px - 52px)}

/* Left: Flow */
.fl{border-right:1px solid var(--bd);padding:12px;overflow-y:auto;background:var(--sf)}
.fl h3{font-size:10px;font-weight:600;color:var(--txm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.fn{display:flex;gap:6px;padding:6px 8px;border-radius:5px;margin-bottom:2px;cursor:pointer;transition:.15s;border:1px solid transparent;align-items:flex-start}
.fn:hover{background:var(--sf2)}
.fn.on{background:var(--acs);border-color:var(--ac)}
.fn.past{opacity:.45}
.fn .ic{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.fn.leader .ic{background:var(--acs);color:var(--c1)}
.fn.parser .ic{background:#34d39922;color:var(--c3)}
.fn.writer .ic{background:#60a5fa22;color:var(--c5)}
.fn.integrator .ic{background:#f472b622;color:var(--pink)}
.fn .t{font-size:11px;font-weight:500;line-height:1.3}
.fn .d{font-size:9px;color:var(--txm);margin-top:1px}
.conn{width:1px;height:8px;background:var(--bd);margin-left:9px}

/* Center: Main Token View */
.ct{display:flex;flex-direction:column;overflow-y:auto;padding:16px 20px;gap:14px}

/* Current Agent Window */
.agent-window{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;flex-shrink:0}
.aw-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.aw-title{font-size:12px;font-weight:600;color:var(--txm);text-transform:uppercase;letter-spacing:.5px}
.aw-agent{display:flex;align-items:center;gap:8px}
.aw-av{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.aw-av.leader{background:var(--acs);color:var(--c1)}
.aw-av.parser{background:#34d39922;color:var(--c3)}
.aw-av.writer{background:#60a5fa22;color:var(--c5)}
.aw-av.integrator{background:#f472b622;color:var(--pink)}
.aw-nm{font-size:14px;font-weight:600}
.aw-rl{font-size:10px;color:var(--txm)}
.aw-stats{display:flex;gap:20px;align-items:baseline}
.aw-stat{text-align:right}
.aw-stat .lb{font-size:9px;color:var(--txm);text-transform:uppercase}
.aw-stat .vl{font-size:18px;font-weight:700;font-family:monospace}
.aw-stat .vl.ok{color:var(--ok)}.aw-stat .vl.wn{color:var(--wn)}.aw-stat .vl.dg{color:var(--dg)}
.aw-bar{height:28px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--bd)}
.aw-seg{height:100%;float:left;transition:width .6s cubic-bezier(.4,0,.2,1);position:relative;display:flex;align-items:center;justify-content:center}
.aw-seg span{font-size:9px;font-weight:600;color:#fff;mix-blend-mode:difference;white-space:nowrap}
.aw-marker{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--dg);z-index:2;opacity:.6}
.aw-marker::after{content:'';position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--dg)}
.aw-legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.aw-legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--txm)}
.aw-legend-item .dt{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* Global Cumulative */
.global-panel{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;flex-shrink:0}
.gp-title{font-size:12px;font-weight:600;color:var(--txm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.gp-title .warn{font-size:10px;color:var(--wn);font-weight:400;text-transform:none;letter-spacing:0}
.gp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.gp-card{background:var(--sf2);border-radius:8px;padding:12px;text-align:center;border:1px solid var(--bd)}
.gp-card .lb{font-size:9px;color:var(--txm);text-transform:uppercase;margin-bottom:4px}
.gp-card .vl{font-size:20px;font-weight:700;font-family:monospace}
.gp-card .vl.ac{color:var(--ac)}
.gp-card .vl.ok{color:var(--ok)}
.gp-card .vl.wn{color:var(--wn)}
.gp-card .vl.dg{color:var(--dg)}
.gp-card .unt{font-size:10px;color:var(--txd);margin-top:2px}

/* Step bar chart */
.step-chart{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;flex-shrink:0}
.sc-title{font-size:12px;font-weight:600;color:var(--txm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sc-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.sc-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;height:100%}
.sc-bar{width:100%;border-radius:4px 4px 0 0;transition:all .4s cubic-bezier(.4,0,.2,1);position:relative;min-height:2px}
.sc-bar.new{background:var(--ac)}
.sc-bar.old{background:var(--sf3)}
.sc-bar.active{box-shadow:0 0 12px var(--acg);background:var(--ac)}
.sc-bar:hover{filter:brightness(1.3)}
.sc-bar .lbl{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:8px;font-family:monospace;color:var(--txm);white-space:nowrap}
.sc-xlbl{font-size:8px;color:var(--txd);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.sc-legend{display:flex;gap:14px;margin-top:8px}
.sc-legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--txm)}
.sc-legend-item .sq{width:10px;height:10px;border-radius:2px}

/* Changes */
.changes{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;flex-shrink:0}
.ch-title{font-size:11px;font-weight:600;color:var(--txm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.ch-list{display:flex;flex-direction:column;gap:3px}
.ch-item{font-size:11px;line-height:1.5;padding:4px 8px;border-radius:4px;background:var(--sf2)}
.ch-item.a{border-left:2px solid var(--ok)}
.ch-item.r{border-left:2px solid var(--dg)}
.ch-item.n{border-left:2px solid var(--info)}
.ch-item.a{color:var(--ok)}.ch-item.r{color:var(--dg)}.ch-item.n{color:var(--info)}
.ch-item b{color:var(--tx)}

/* Right: Agent info + Messages */
.rt{border-left:1px solid var(--bd);display:flex;flex-direction:column;background:var(--sf);overflow:hidden}
.rt-header{padding:12px 14px;border-bottom:1px solid var(--bd);background:var(--sf2);flex-shrink:0}
.rt-step{font-size:13px;font-weight:600}
.rt-desc{font-size:10px;color:var(--txm);margin-top:2px}
.rt-msgs{flex:1;overflow-y:auto;padding:10px}
.rm{border-radius:6px;margin-bottom:6px;border:1px solid var(--bd);overflow:hidden;font-size:10px}
.rm-h{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:var(--sf2);cursor:pointer}
.rm-role{font-size:8px;font-weight:600;padding:1px 5px;border-radius:2px;text-transform:uppercase}
.rm-role.sys{background:var(--acs);color:var(--c1)}
.rm-role.usr{background:#60a5fa22;color:var(--c5)}
.rm-role.ast{background:#fbbf2422;color:var(--c4)}
.rm-role.tl{background:#34d39922;color:var(--c3)}
.rm-tk{font-size:8px;font-family:monospace;color:var(--txd)}
.rm-bd{padding:8px;color:var(--txm);line-height:1.5;display:none;background:var(--bg)}
.rm:not(.collapsed) .rm-bd{display:block}
.rm-bd b{color:var(--tx);font-size:10px}
.rm-bd code{font-family:monospace;font-size:9px;background:var(--sf);padding:0 3px;border-radius:2px;color:var(--ac)}
.rm-bd pre{background:var(--sf2);padding:6px;border-radius:3px;margin-top:4px;font-size:9px;line-height:1.4;white-space:pre-wrap;border:1px solid var(--bd);max-height:80px;overflow-y:auto}
.rm-bd .fade{color:var(--txd);font-style:italic}
.rm.new{animation:pulse 1.2s ease}

/* Bottom */
.ctrl{height:52px;padding:0 20px;background:var(--sf);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ctrl .si{font-size:12px;color:var(--txm)}
.ctrl .si b{color:var(--tx)}
.bg{display:flex;gap:8px}
.btn{padding:7px 18px;border-radius:6px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-size:12px;font-weight:500;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover:not(:disabled){background:var(--sf3);border-color:var(--txm)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.p:hover:not(:disabled){background:#8a7aff;box-shadow:0 0 10px var(--acg)}

/* Session switch indicator */
.session-switch{background:var(--acs);border:1px dashed var(--ac);border-radius:6px;padding:8px 12px;margin-bottom:8px;font-size:10px;color:var(--ac);text-align:center;display:none}
.session-switch.show{display:block}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
@keyframes pulse{0%{border-color:var(--ac);box-shadow:0 0 0 0 var(--acg)}50%{border-color:var(--ac);box-shadow:0 0 12px 2px var(--acg)}100%{border-color:var(--bd);box-shadow:none}}
</style>
</head>

<div class="sc-legend">
<div class="sc-legend-item"><div class="sq" style="background:var(--sf3)"></div>历史步骤</div>
<div class="sc-legend-item"><div class="sq" style="background:var(--ac)"></div>当前步骤新增</div>
</div>
</div>
<!-- Changes -->
<div class="changes">
<div class="ch-title">本步关键变化</div>
<div class="ch-list" id="chList"></div>
</div>
</div>
<div class="rt">
<div class="rt-header">

<div class="rt-desc" id="rtDesc"></div>
</div>
<div class="session-switch" id="ssSwitch"></div>
<div class="rt-msgs" id="rtMsgs"></div>
</div>
</div>
<div class="ctrl">

<div class="bg">
<button class="btn" id="bp" onclick="prev()">← 上一步</button>
<button class="btn p" id="bn" onclick="next()">下一步 →</button>
</div>
</div>

var cur=-1;
var COLORS={s:"var(--c1)",k:"var(--c2)",t:"var(--c3)",h:"var(--c4)",i:"var(--c5)"};
var LABELS={s:"System",k:"SKILL",t:"Tools",h:"History",i:"Input/Data"};

function fmt(n){if(n>=1000)return (n/1000).toFixed(1)+'K';return n+''}
function pct(n){return((n/LIMIT)*100).toFixed(1)}

function init(){
  var d=document.getElementById('dots');
  d.innerHTML=S.map(function(_,i){return '<div class="dot" onclick="go('+i+')"></div>'}).join('');
  renderFL();
  render();
}

function renderFL(){
  var c=document.getElementById('flist');
  c.innerHTML=S.map(function(s,i){
    var tp=s.agent,ic=s.name[0];
    var cls='fn '+tp+(i===cur?' on':'')+(i<cur?' past':'');
    return '<div class="'+cls+'" onclick="go('+i+')"><div class="ic">'+ic+'</div><div><div class="t">'+s.title.replace(/^Step \d+ · /,'')+'</div><div class="d">'+fmt(s.cur.n)+' tk</div></div></div>'+(i<S.length-1?'<div class="conn"></div>':'');
  }).join('');
}

function renderAgentWindow(step){
  var c=document.getElementById('awAgent');
  c.innerHTML='<div class="aw-av '+step.agent+'">'+step.name[0]+'</div><div><div class="aw-nm">'+step.name+'</div><div class="aw-rl">'+step.role+' · Session: '+step.session+'</div></div>';

  var t=step.cur,used=t.n,free=LIMIT-used,p=pct(used);
  document.getElementById('awUsed').textContent=fmt(used);
  document.getElementById('awFree').textContent=fmt(free);
  document.getElementById('awPct').textContent=p+'%';

  var usedEl=document.getElementById('awUsed');
  var pctEl=document.getElementById('awPct');
  usedEl.className='vl'+(p>50?' wn':'')+(p>80?' dg':' ok');
  pctEl.className='vl'+(p>50?' wn':'')+(p>80?' dg':' ok');

  // Stacked bar
  var bar=document.getElementById('awBar');
  var segs=[['s',t.s],['k',t.k],['t',t.t],['h',t.h],['i',t.i]];
  var html='';
  var dangerPos=100; // position of danger zone marker (80%)
  segs.forEach(function(seg){
    if(seg[1]>0){
      var w=(seg[1]/LIMIT*100);
      html+='<div class="aw-seg" style="width:'+w+'%;background:'+COLORS[seg[0]]+'"><span>'+fmt(seg[1])+'</span></div>';
    }
  });
  // Free space
  var freeW=(free/LIMIT*100);
  html+='<div class="aw-seg" style="width:'+freeW+'%;background:var(--bg)"></div>';
  // Danger marker at 80%
  html+='<div class="aw-marker" style="left:80%"></div>';
  bar.innerHTML=html;

  // Legend
  var lg=document.getElementById('awLegend');
  lg.innerHTML=segs.filter(function(s){return s[1]>0}).map(function(s){
    return '<div class="aw-legend-item"><div class="dt" style="background:'+COLORS[s[0]]+'"></div>'+LABELS[s[0]]+': '+fmt(s[1])+' ('+((s[1]/used*100).toFixed(0))+'%)</div>';
  }).join('')+'<div class="aw-legend-item"><div class="dt" style="background:var(--bd)"></div>剩余: '+fmt(free)+'</div><div class="aw-legend-item"><div class="dt" style="background:var(--dg);opacity:.5"></div>80%警戒线</div>';
}

function renderGlobal(step){
  var cumTotal=0,cumCalls=0;
  for(var i=0;i<=cur;i++){cumTotal+=S[i].delta;cumCalls=S[i].calls}
  var cost=(cumTotal/1000000*COST_PER_1M).toFixed(4);

  document.getElementById('gpStep').textContent='+'+fmt(step.delta);
  document.getElementById('gpTotal').textContent=fmt(cumTotal);
  document.getElementById('gpCalls').textContent=cumCalls;
  document.getElementById('gpCost').textContent='$'+cost;
}

function renderChart(){
  var chart=document.getElementById('scChart');
  var maxDelta=0;
  S.forEach(function(s){if(s.delta>maxDelta)maxDelta=s.delta});
  chart.innerHTML=S.map(function(s,i){
    var isActive=i===cur,isPast=i<cur;
    var h=Math.max((s.delta/maxDelta*100),2);
    var cls='sc-bar'+(isActive?' active':'')+(isPast?' old':' new');
    var xlbl=s.title.replace(/Step \d+ · /,'').substring(0,6);
    return '<div class="sc-bar-wrap" onclick="go('+i+')" title="'+s.title+': '+fmt(s.delta)+'tk"><div class="'+cls+'" style="height:'+h+'%"><div class="lbl">'+fmt(s.delta)+'</div></div><div class="sc-xlbl">'+xlbl+'</div></div>';
  }).join('');
}

function renderChanges(step){
  var cl=document.getElementById('chList');
  cl.innerHTML=step.ch.map(function(c){
    var cls=c.c==='a'?'a':c.c==='r'?'r':c.c==='i'?'n':'n';
    var prefix=c.c==='a'?'+ ':c.c==='r'?'⚠ ':c.c==='i'?'💡 ':'→ ';
    return '<div class="ch-item '+cls+'">'+prefix+c.t+'</div>';
  }).join('');
}

function renderMsgs(step){
  document.getElementById('rtStep').textContent=step.title;
  document.getElementById('rtDesc').textContent=step.desc;

  var sw=document.getElementById('ssSwitch');
  if(step.newSession&&cur>0){
    sw.textContent='🔄 新Session启动: '+step.name+' (上下文重置为0)';
    sw.className='session-switch show';
  }else{
    sw.className='session-switch';
  }

  var c=document.getElementById('rtMsgs');
  c.innerHTML='';
  step.msgs.forEach(function(m,i){
    var roleMap={sys:'sys',usr:'usr',ast:'ast',tl:'tl'};
    var roleLabel={sys:'System',usr:'User',ast:'Assist',tl:'Tool'};
    var d=document.createElement('div');
    d.className='rm'+(m.n?' new':' collapsed');
    d.innerHTML='<div class="rm-h" onclick="tglRm(this)"><span class="rm-role '+roleMap[m.role]+'">'+roleLabel[m.role]+'</span><span class="rm-tk">'+fmt(m.tk)+'tk</span></div><div class="rm-bd">'+m.html+'</div>';
    c.appendChild(d);
  });
}

function tglRm(h){h.parentElement.classList.toggle('collapsed')}

function updateDots(){document.querySelectorAll('.dot').forEach(function(d,i){d.classList.toggle('on',i===cur);d.classList.toggle('done',i<cur)})}

function render(){
  if(cur<0){
    document.getElementById('rtStep').textContent='等待开始';
    document.getElementById('rtDesc').textContent='';
    document.getElementById('rtMsgs').innerHTML='<div style="text-align:center;padding:40px 10px;color:var(--txd);font-size:11px">点击"下一步"开始<br>追踪Token变化</div>';
    document.getElementById('ssSwitch').className='session-switch';
    // Empty state for center
    document.getElementById('awUsed').textContent='0';
    document.getElementById('awFree').textContent='128K';
    document.getElementById('awPct').textContent='0%';
    document.getElementById('awBar').innerHTML='<div class="aw-seg" style="width:100%;background:var(--bg)"></div><div class="aw-marker" style="left:80%"></div>';
    document.getElementById('awAgent').innerHTML='<div class="aw-av leader" style="background:var(--sf3);color:var(--txd)">?</div><div><div class="aw-nm" style="color:var(--txd)">未启动</div><div class="aw-rl">点击下一步</div></div>';
    document.getElementById('awLegend').innerHTML='';
    document.getElementById('gpStep').textContent='0';
    document.getElementById('gpTotal').textContent='0';
    document.getElementById('gpCalls').textContent='0';
    document.getElementById('gpCost').textContent='$0.00';
    document.getElementById('chList').innerHTML='<div class="ch-item n">准备开始追踪...</div>';
    renderChart();
    document.getElementById('bp').disabled=true;
    document.getElementById('bn').disabled=false;
    document.getElementById('sinfo').innerHTML='点击"下一步"追踪Token变化';
    updateDots();
    renderFL();
    return;
  }
  var step=S[cur];
  renderAgentWindow(step);
  renderGlobal(step);
  renderChart();
  renderChanges(step);
  renderMsgs(step);
  document.getElementById('bp').disabled=cur<=0;
  document.getElementById('bn').disabled=cur>=S.length-1;
  document.getElementById('sinfo').innerHTML='<b>'+step.title+'</b> — 当前Session占用 '+fmt(step.cur.n)+'/'+fmt(LIMIT)+' ('+pct(step.cur.n)+'%)';
  updateDots();
  renderFL();
}

function next(){if(cur<S.length-1){cur++;render()}}
function prev(){if(cur>=0){cur--;if(cur<0){cur=-1;render()}else render()}}
function go(i){cur=i;render()}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
init();
</script>
